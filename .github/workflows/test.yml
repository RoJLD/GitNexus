name: tests

# Hardened 2026-07-11 (ROADMAP § "Update 2026-07-10", phase (i) CI durcie):
# - triggers on ALL branches + PRs — the feature branches carried a month of
#   work with literally zero CI (the 2026-06-15 deployment runs were the last
#   ones, and they were all red);
# - upstream uses TWO tag namespaces (measured): git tags are 'v'-prefixed
#   (v1.6.5 — what apply-upstream-patches.mjs clones) while DOCKER image tags
#   are not (1.6.5 exists, v1.6.5 is manifest-unknown). The old pre-pull used
#   the git-tag form → manifest unknown → broke every docker job since
#   2026-06-15. The pre-pull now derives the image tag from Dockerfile.cli
#   (the file that actually pins it) instead of guessing;
# - cost guards: one run per ref (cancel-in-progress) and the heavy docker
#   jobs only run on deployment / PRs / manual dispatch — feature branches
#   get the fast gates (build-gate, unit, inventory-check).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GIT tag form ('v' prefix) — consumed by scripts/apply-upstream-patches.mjs.
  # The docker IMAGE tag is derived from Dockerfile.cli in the pre-pull steps.
  # Re-bumped to v1.6.7 on 2026-07-11 (sources+patches now v1.6.7-based). If a
  # repo-level `vars.GITNEXUS_VERSION` is set it MUST be v1.6.7 or the patches
  # (v1.6.7-based) will not apply to a v1.6.5 clone.
  GITNEXUS_VERSION: ${{ vars.GITNEXUS_VERSION || 'v1.6.7' }}
  # 22.12.0 is the engines floor of @rolldown/binding-* (^20.19.0 || >=22.12.0).
  # On 22.11.0 npm SILENTLY SKIPS the optional native binding (engines-gated
  # optional dep) → vitest dies at startup with "Cannot find native binding"
  # (measured run 29148722437 — the same failure was misread as npm bug #4828
  # on the 2026-06-15 runs). Matches __REQUIRED_NODE_VERSION__ in the app.
  NODE_VERSION: '22.12.0'

jobs:
  # Recurrence guard (added 2026-06-03). On 2026-05-31 the patch files were
  # accidentally gutted (regenerated from a partial clone), leaving a frontend
  # that does not compile — and because every other job is continue-on-error,
  # nothing blocked. This job is intentionally NOT continue-on-error: it fails
  # the workflow if the committed patches do not produce a building web image.
  # Locally, run `cohabit drift gitnexus` (fork-cohabitation) BEFORE committing
  # any upstream/ edit, and regenerate the diffs per patches/README.md.
  build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Apply upstream patches to a fresh clone
        run: node scripts/apply-upstream-patches.mjs
      - name: Pre-pull upstream image (tag derived from Dockerfile.cli — docker tags have no 'v' prefix)
        run: docker pull "$(grep -oE 'ghcr\.io/abhigyanpatwari/gitnexus:[0-9][0-9.]*' Dockerfile.cli | head -1)"
      - name: Build derived images (FAILS if patches don't produce a building image)
        run: docker compose -f docker-compose.test.yml build

  # Blocking guard (added 2026-06-03) for the missing-Dockerfile-COPY boot-crash
  # class. build-gate BUILDS the web image but never BOOTS it, so a route module
  # absent from Dockerfile.web's explicit per-file COPY list (docker-server.mjs
  # imports it at boot via registerGitnexusRoutes) passes build-gate green and
  # only crash-loops at runtime with ERR_MODULE_NOT_FOUND (hit during P1, fixed
  # in 10879d77). This job boots the stack and curls the web container's
  # /graph/templates — which loads ALL route modules — so a missing COPY turns it
  # red. Intentionally NOT continue-on-error.
  boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Heavy docker job — deployment / PR / dispatch only (cost guard).
    if: github.ref == 'refs/heads/deployment' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Apply upstream patches to a fresh clone
        run: node scripts/apply-upstream-patches.mjs
      - name: Pre-pull upstream image (tag derived from Dockerfile.cli — docker tags have no 'v' prefix)
        run: docker pull "$(grep -oE 'ghcr\.io/abhigyanpatwari/gitnexus:[0-9][0-9.]*' Dockerfile.cli | head -1)"
      - name: Build derived images
        run: docker compose -f docker-compose.test.yml build
      - name: Extract a projects root for the mount
        run: mkdir -p /tmp/boot-proj && tar -xzf tests/fixtures/sample-repo.tar.gz -C /tmp/boot-proj
      - name: Boot the stack
        run: TEST_PROJECTS_ROOT=/tmp/boot-proj docker compose -f docker-compose.test.yml up -d
      - name: Smoke — web boots and serves /graph/templates (loads all route modules)
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173/graph/templates >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::web /graph/templates never came up — boot crash (missing Dockerfile.web COPY?)"
            docker compose -f docker-compose.test.yml logs --no-color gitnexus-web-test | tail -50
            exit 1
          fi
          # Assert the P1 route modules actually registered (proves graph-lens +
          # academic-json + graph-templates all loaded, not just that the server is up).
          body="$(curl -fsS http://localhost:4173/graph/templates)"
          echo "$body" | grep -q 'imports-deps' || { echo "::error::imports-deps lens absent — a route module failed to load"; exit 1; }
          echo "$body" | grep -q 'academic-literature' || { echo "::error::academic-literature absent — a route module failed to load"; exit 1; }
          curl -fsS http://localhost:4173/metrics | grep -q '"latency"' || { echo "::error::/metrics route absent — docker-server-metrics.mjs failed to load (missing Dockerfile.web COPY?)"; exit 1; }
          echo "metrics smoke OK"
          echo "boot smoke OK"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color > boot-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boot-smoke-logs
          path: boot-logs.txt
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Enforced 2026-07-11 — continue-on-error on this job (and unit) masked the
  # two patch-gutting incidents (2026-05-31, 2026-07-07): the workflow stayed
  # green while the committed diffs no longer produced a working frontend.
  inventory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify test inventory
        run: node scripts/check-test-inventory.mjs

  # Enforced 2026-07-11 — suite measured fully green (718/718) after the
  # environment fixes (localStorage stub for Node>=22 native webstorage,
  # rolldown shebang strip, Windows path normalize, panel-groups.ts recovered
  # from be99d6dd). No quarantine needed. A red unit job now BLOCKS.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'
      - run: cd tests && npm ci
      - name: Apply upstream patches (for components paths)
        run: node scripts/apply-upstream-patches.mjs
      - name: Install gitnexus-web deps (component tests import web sources whose deps — graphology, @langchain/core — resolve from upstream/gitnexus-web/node_modules)
        # `npm install` (not `npm ci`) — same rationale as Dockerfile.web: the
        # web package-lock drifts on platform-specific optionals (@emnapi/*,
        # Σ-EMNAPI-LOCKFILE-DRIFT) and npm ci hard-fails on the mismatch.
        run: npm install --prefix upstream/gitnexus-web --no-audit --no-fund
      - run: cd tests && npm run test:unit -- --reporter=verbose

  # Still continue-on-error on 2026-07-11 — needs a full docker stack in CI
  # and has no green-run baseline yet. DATED ENFORCEMENT (ROADMAP § Update
  # 2026-07-10): flip after 2 observed green runs on PR, and AT THE LATEST
  # before the phase (ii) proofs (copilot-phase-d-prove / classdiagram-build)
  # land — those proofs are worthless inside an always-green job.
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    # Heavy docker job — deployment / PR / dispatch only (cost guard).
    if: github.ref == 'refs/heads/deployment' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'
      - run: cd tests && npm ci
      - name: Apply upstream patches
        run: node scripts/apply-upstream-patches.mjs
      - name: Pre-pull upstream image (tag derived from Dockerfile.cli — docker tags have no 'v' prefix)
        run: docker pull "$(grep -oE 'ghcr\.io/abhigyanpatwari/gitnexus:[0-9][0-9.]*' Dockerfile.cli | head -1)"
      - name: Build derived images
        run: docker compose -f docker-compose.test.yml build
      - name: Run integration tests
        run: cd tests && npm run test:integ -- --reporter=verbose
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color > docker-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: docker-logs.txt
      - name: Teardown stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Same dated-enforcement contract as `integration` (see comment there).
  e2e:
    runs-on: ubuntu-latest
    needs: integration
    continue-on-error: true
    timeout-minutes: 20
    if: github.ref == 'refs/heads/deployment' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'
      - run: cd tests && npm ci
      - name: Install Playwright chromium
        run: cd tests && npx playwright install --with-deps chromium
      - name: Apply upstream patches
        run: node scripts/apply-upstream-patches.mjs
      - name: Build derived images
        run: docker compose -f docker-compose.test.yml build
      - name: Bring stack up
        run: docker compose -f docker-compose.test.yml up -d
      - name: Wait for stack
        run: cd tests && node integration/helpers/wait-ready.mjs
      - name: Run e2e
        run: cd tests && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
